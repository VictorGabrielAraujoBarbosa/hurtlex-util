name: Python Package Tests

# 1. When should this run?
on:
  push:
    branches: [ "main" ]
  pull_request: # Also runs if a colleague proposes a change
    branches: [ "main" ]

jobs:
  test:
    # 2. What operating system should it run on?
    runs-on: ubuntu-latest
    
    # 3. Test across multiple Python versions
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    # Step A: Download your repository's code onto the GitHub server
    - name: Checkout repository
      uses: actions/checkout@v4

    # Step B: Install the specific Python version from the matrix above
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip' # Caches downloaded packages so future tests run faster

    # Step C: Install your package in editable mode with the dev tools
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # Step D: Run your pytest suite
    - name: Run tests with pytest
      run: |
        pytest